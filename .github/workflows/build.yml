name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        run: dotnet publish TimeKeeper.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: TimeKeeper
          path: out/TimeKeeper.exe
