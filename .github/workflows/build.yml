name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish
        run: dotnet publish TimeKeeper.csproj -c Release -o out

      - name: Publish EXE to Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest out/TimeKeeper.exe --title "Build ${{ github.run_number }}" --notes "Windows x64 exe. If Windows warns about an unrecognized app, click More info, then Run anyway." --target "${{ github.sha }}"
